name: AgriPulse CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Verify Multiplatform System
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Multiplatform Unit Tests
        run: ./gradlew :composeApp:allTests --continue --stacktrace

      - name: Build Desktop Distribution JAR
        run: ./gradlew :composeApp:desktopJar --stacktrace

      - name: Assemble Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace
